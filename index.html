<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JURAGAN - Buku Kas Digital Sederhana & Praktis</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#f7faf6] text-[#2d3a29] antialiased pb-12">

    <div id="root"></div>

    <script type="text/babel">
        // 1. Inisialisasi State Awal
        const DEFAULT_TRANSACTIONS = [];
        const DEFAULT_USER_TEMPLATES = [];

        // 2. Komponen Utama Aplikasi
        function App() {
            const [transactions, setTransactions] = React.useState(DEFAULT_TRANSACTIONS);
            const [userTemplates, setUserTemplates] = React.useState(DEFAULT_USER_TEMPLATES);

            /* TEMPELKAN SEMUA SISA KODE LOGIKA JURAGAN KAMU DI SINI 
               (Mulai dari fungsi handleAddTransaction, fungsi kalkulasi, 
               hingga blok 'return (...)' yang berisi kode JSX/HTML-nya)
            */

            // Contoh penutup return komponen (pastikan disesuaikan dengan kode asli kamu)
            return (
                <div className="p-6">
                    {/* Isi tampilan UI aplikasi kas kamu */}
                    <h1 className="text-2xl font-bold">Aplikasi JURAGAN</h1>
                </div>
            );
        }

        // 3. Render Aplikasi ke DOM (Bagian ini WAJIB ada di paling bawah)
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
